<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Google OAuth Callback</title>
<style>body{background:#1a1a2e;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:-apple-system,system-ui,sans-serif;flex-direction:column;gap:16px;text-align:center;padding:20px}.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.1);border-top-color:#6c63ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="spinner"></div>
<p>Connecting to Study Hub...</p>
<script>
  (function() {
    try {
      var hash = window.location.hash.substring(1);
      var params = new URLSearchParams(hash);
      var token = params.get('access_token');
      if (token) {
        if (window.opener) {
          window.opener.postMessage({ type: 'google-oauth', accessToken: token }, window.location.origin);
          document.body.innerHTML = '<div style="color:#4ade80;font-size:48px">✓</div><p>Connected! You can close this window.</p>';
        } else {
          document.body.innerHTML = '<p>No opener window found. Please close this tab and try again.</p>';
        }
      } else {
        var error = params.get('error');
        if (error) {
          document.body.innerHTML = '<p>Authorization failed: ' + error + '</p>';
        } else {
          document.body.innerHTML = '<p>No access token received. Please try again.</p>';
        }
      }
    } catch(e) {
      document.body.innerHTML = '<p>Error processing OAuth response.</p>';
    }
  })();
</script>
</body>
</html>
