name: CI checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Syntax, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        # Catches YAML / expression errors in .github/workflows before they can
        # break a release. This guard caught a job-level env context error that
        # GitHub's parser had silently rejected the whole workflow for.
        uses: rhysd/actionlint@v1

      - name: Syntax-check all JavaScript
        run: |
          for f in app.js cloud-core.js mobile.js studymap-data.js subject-labs.js build.js; do
            echo "node --check $f"
            node --check "$f" || exit 1
          done

      - name: Secret-leak guard
        run: |
          # Fail the build if a tracked file contains a known secret pattern
          # (Groq keys, OpenAI keys, GitHub PATs, private keys, JWT-style tokens).
          # NOTE: the Supabase ANON key in cloud-core.js is public by design and
          # intentionally not flagged. Only service-role secrets are caught
          # (the base64 of "role":"service_role" inside the JWT, plus sbp_).
          if grep -rInE "(gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|gh[pous]_[A-Za-z0-9]{30,}|AIza[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z]+ PRIVATE KEY-----|sbp_[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{0,200}InJvbGUiOiJzZXJ2aWNlX3JvbGUi)" \
            --include='*.js' --include='*.html' --include='*.json' --include='*.md' --include='*.sql' --include='*.yml' --include='*.yaml' \
            --exclude-dir=node_modules --exclude-dir=release --exclude-dir=www --exclude-dir=downloads --exclude-dir=.qa --exclude-dir=docs --exclude-dir=assets --exclude-dir=music --exclude-dir=ios --exclude-dir=android --exclude-dir=supabase --exclude-dir=.vercel .; then
            echo "::error::Secret pattern detected in tracked files — rotate and remove it."
            exit 1
          fi
          echo "No secret patterns found"

      - name: Run test suite
        run: npm test

      - name: Accessibility guard
        run: node scripts/a11y-static.js

      - name: Validate build
        run: node build.js

  smoke:
    name: Headless app smoke test (all tabs render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run headless smoke test
        env:
          CI: "true"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          # xvfb gives Electron a virtual display; the smoke test sweeps all
          # tabs, runs the a11y label guard and the keyboard focus walk, and
          # fails on console errors, broken panels, or focus-ring regressions.
          xvfb-run -a npm run test:qa
