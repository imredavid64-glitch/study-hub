name: CI checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Syntax, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all JavaScript
        run: |
          for f in app.js cloud-core.js mobile.js studymap-data.js subject-labs.js build.js; do
            echo "node --check $f"
            node --check "$f" || exit 1
          done

      - name: Run test suite
        run: npm test

      - name: Validate build
        run: node build.js
