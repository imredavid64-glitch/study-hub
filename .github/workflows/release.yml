name: Build desktop installers

# Builds the macOS, Windows and Linux desktop apps on every v* release tag and
# publishes them directly to the public installers repo (no GitHub Actions
# artifact storage involved — it hit the account quota) so the Downloads tab
# keeps working.
#
# Publishing needs a PAT with "Contents: write" on imredavid64-glitch/study-hub-installers
# stored as the INSTALLERS_PAT repository secret. Without it, the build still
# runs, but the publish step is skipped.

on:
  push:
    tags:
      - 'v*'
  # Manual runs build the installers but never publish.
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac dmg zip --universal
            rename: |
              find release -maxdepth 1 -name '*.dmg' -exec mv {} release/Study-Hub-mac.dmg \; || true
              find release -maxdepth 1 -name '*universal-mac.zip' -exec mv {} release/Study-Hub-mac.zip \; || true
          - name: Windows
            os: windows-latest
            args: --win zip
            rename: |
              find release -maxdepth 1 -name '*-win.zip' -exec mv {} release/Study-Hub-Windows.zip \; || true
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb
            rename: |
              find release -maxdepth 1 -name '*.AppImage' -exec mv {} release/Study-Hub-Linux.AppImage \; || true
              find release -maxdepth 1 -name '*.deb' -exec mv {} release/Study-Hub-Linux.deb \; || true
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.INSTALLERS_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (${{ matrix.name }})
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "Building version ${VERSION}"
          npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="${VERSION}"
        shell: bash
        env:
          # No code-signing certificates on CI; macOS gets ad-hoc signing only.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Rename to stable download names
        run: ${{ matrix.rename }}
        shell: bash

      - name: Publish to installers repo
        # Only publish on real tag pushes, and only when the PAT is configured.
        # The release is created by whichever job gets there first; the others
        # upload their own assets to it. No GitHub artifact storage involved.
        if: ${{ env.GH_TOKEN != '' && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo "imredavid64-glitch/study-hub-installers" \
            --title "Study Hub $TAG" \
            --notes "Desktop installers for Study Hub $TAG, built automatically by GitHub Actions." \
            --latest 2>/dev/null || true
          for f in release/Study-Hub-*; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --repo "imredavid64-glitch/study-hub-installers" --clobber
          done

      - name: Publish skipped notice
        if: ${{ env.GH_TOKEN == '' }}
        run: echo "::warning::INSTALLERS_PAT secret is not set — installers were not published."

      - name: List built installers
        shell: bash
        run: ls -la release/

  summary:
    name: Summary
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.INSTALLERS_PAT }}
    steps:
      - name: Note where to find the installers
        run: |
          echo "Installers were built for this tag: ${{ github.ref_name }}"
          if [ -n "$GH_TOKEN" ]; then
            echo "Published to https://github.com/imredavid64-glitch/study-hub-installers/releases/latest"
          else
            echo "Publish skipped (no INSTALLERS_PAT secret)."
          fi
