name: Build desktop installers

# Builds the macOS, Windows and Linux desktop apps on every v* release tag,
# smoke-tests each installer (integrity, contents, version, size) and only then
# publishes them directly to the public installers repo (no GitHub Actions
# artifact storage involved — it hit the account quota) so the Downloads tab
# keeps working.
#
# Publishing needs a PAT with "Contents: write" on imredavid64-glitch/study-hub-installers
# stored as the INSTALLERS_PAT repository secret. Without it, the build still
# runs, but the publish step is skipped.
#
# The scheduled "Retry installer publish" workflow dispatches this with a `tag`
# input to re-run the build+publish for a release whose installers are missing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      # Re-build and publish this tag's installers. Only used by the scheduled
      # retry workflow and manual re-runs; a plain dispatch with no tag just
      # builds the current package.json version without publishing.
      tag:
        description: 'Version tag to build and publish (e.g. v1.1.4)'
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac dmg zip --universal
            id: mac
            checksum_files: 'Study-Hub-mac.dmg Study-Hub-mac.zip'
            rename: |
              find release -maxdepth 1 -name '*.dmg' -exec mv {} release/Study-Hub-mac.dmg \; || true
              find release -maxdepth 1 -name '*universal-mac.zip' -exec mv {} release/Study-Hub-mac.zip \; || true
            # Verify the dmg (integrity + mount + app bundle + version) and the
            # zip (CRC check + .app presence). Failing here blocks publishing.
            smoke: |
              set -euo pipefail
              cd release
              echo "== dmg integrity =="
              hdiutil verify Study-Hub-mac.dmg
              SIZE="$(wc -c < Study-Hub-mac.dmg)"
              echo "dmg size: $SIZE bytes"
              [ "$SIZE" -gt 50000000 ] || { echo "dmg too small ($SIZE)"; exit 1; }
              echo "== dmg contents =="
              MOUNT="$(hdiutil attach -readonly -nobrowse -noautoopen Study-Hub-mac.dmg | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
              echo "mounted at: $MOUNT"
              APP="$(find "$MOUNT" -maxdepth 2 -name '*.app' | head -1)"
              if [ -z "$APP" ]; then echo "no .app bundle in dmg"; hdiutil detach "$MOUNT" || true; exit 1; fi
              echo "app bundle: $APP"
              VER="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
              echo "app version: $VER"
              if [ "$VER" != "$EXPECTED" ]; then
                echo "version mismatch ($VER != $EXPECTED)"; hdiutil detach "$MOUNT" || true; exit 1
              fi
              hdiutil detach "$MOUNT" || true
              echo "== mac zip integrity =="
              unzip -t Study-Hub-mac.zip | tail -1
              # No -q: grep must drain the pipe or the upstream unzip hits
              # SIGPIPE and pipefail turns a clean match into a failure.
              unzip -l Study-Hub-mac.zip | grep '\.app/' >/dev/null \
                && echo "zip contains the .app" || { echo "no .app in zip"; exit 1; }
              echo "SMOKE TEST PASSED"
          - name: Windows
            os: windows-latest
            args: --win zip
            id: win
            checksum_files: 'Study-Hub-Windows.zip'
            rename: |
              find release -maxdepth 1 -name '*-win.zip' -exec mv {} release/Study-Hub-Windows.zip \; || true
            # Verify the zip (CRC check + .exe presence) and a minimum size so a
            # truncated build can never be published. Failing here blocks publish.
            smoke: |
              set -euo pipefail
              cd release
              SIZE="$(wc -c < Study-Hub-Windows.zip)"
              echo "zip size: $SIZE bytes"
              [ "$SIZE" -gt 50000000 ] || { echo "zip too small ($SIZE)"; exit 1; }
              echo "== windows zip integrity =="
              unzip -t Study-Hub-Windows.zip | tail -1
              # No -q: grep must drain the pipe or the upstream unzip hits
              # SIGPIPE and pipefail turns a clean match into a failure.
              unzip -l Study-Hub-Windows.zip | grep -i '\.exe' >/dev/null \
                && echo "exe present in zip" || { echo "no .exe in zip"; exit 1; }
              echo "SMOKE TEST PASSED"
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb
            id: linux
            checksum_files: 'Study-Hub-Linux.AppImage Study-Hub-Linux.deb'
            rename: |
              find release -maxdepth 1 -name '*.AppImage' -exec mv {} release/Study-Hub-Linux.AppImage \; || true
              find release -maxdepth 1 -name '*.deb' -exec mv {} release/Study-Hub-Linux.deb \; || true
            # Verify the deb (control metadata + payload) and the AppImage
            # (ELF header + extract + AppRun/desktop presence). Failing here
            # blocks publishing.
            smoke: |
              set -euo pipefail
              cd release
              echo "== deb metadata =="
              dpkg-deb --info Study-Hub-Linux.deb
              # No -q: grep must drain the pipe or the upstream tar hits
              # SIGPIPE and pipefail turns a clean match into a failure.
              dpkg-deb --contents Study-Hub-Linux.deb | grep -E 'usr/lib/|opt/' >/dev/null \
                || { echo "no app payload in deb"; exit 1; }
              SIZE="$(wc -c < Study-Hub-Linux.deb)"
              echo "deb size: $SIZE bytes"
              [ "$SIZE" -gt 50000000 ] || { echo "deb too small ($SIZE)"; exit 1; }
              echo "== appimage =="
              file Study-Hub-Linux.AppImage | grep -q 'ELF' || { echo "AppImage is not an ELF binary"; exit 1; }
              chmod +x Study-Hub-Linux.AppImage
              APPIMAGE="$(pwd)/Study-Hub-Linux.AppImage"
              mkdir -p /tmp/appimg-check
              cd /tmp/appimg-check
              rm -rf squashfs-root
              "$APPIMAGE" --appimage-extract >/dev/null 2>&1
              ls squashfs-root | head -5
              [ -x squashfs-root/AppRun ] || { echo "no AppRun in AppImage"; exit 1; }
              find squashfs-root -maxdepth 1 -name '*.desktop' | grep -q . || { echo "no .desktop in AppImage"; exit 1; }
              echo "SMOKE TEST PASSED"
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.INSTALLERS_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (${{ matrix.name }})
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "Building version ${VERSION}"
          npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="${VERSION}"
        shell: bash
        env:
          # No code-signing certificates on CI; macOS gets ad-hoc signing only.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Rename to stable download names
        run: ${{ matrix.rename }}
        shell: bash

      - name: Smoke-test installer (${{ matrix.name }})
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            EXPECTED="${{ github.event.inputs.tag }}"
            EXPECTED="${EXPECTED#v}"
          else
            EXPECTED="$(node -p "require('./package.json').version")"
          fi
          echo "expecting app version: ${EXPECTED}"
          export EXPECTED
          # Run the smoke checks from a script file so its output can be teed to
          # a report for the release notes. pipefail keeps a failed check
          # failing the step (and therefore blocking publish).
          cat > smoke-run.sh <<'SMOKE_EOF'
          ${{ matrix.smoke }}
          SMOKE_EOF
          bash smoke-run.sh 2>&1 | tee "Study-Hub-report-${{ matrix.id }}.txt"
        shell: bash

      - name: Publish to installers repo
        # Publish on tag pushes and on dispatches that name a tag (the scheduled
        # retry workflow), only when the PAT is configured and the smoke test
        # passed (a failing step stops the job before this one runs). The
        # release is created by whichever job gets there first; the others
        # upload their own assets to it. No GitHub artifact storage involved.
        if: ${{ env.GH_TOKEN != '' && (github.event_name == 'push' || github.event.inputs.tag != '') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release create "$TAG" \
            --repo "imredavid64-glitch/study-hub-installers" \
            --title "Study Hub $TAG" \
            --notes "Desktop installers for Study Hub $TAG, built automatically by GitHub Actions." \
            --latest 2>/dev/null || true
          for f in release/Study-Hub-*; do
            [ -f "$f" ] || continue
            case "$f" in *.txt) continue ;; esac
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --repo "imredavid64-glitch/study-hub-installers" --clobber
          done
          # Record sha256 of the exact built files so the verify job (and any
          # user) can prove the published bytes match what was built.
          (cd release && sha256sum ${{ matrix.checksum_files }}) > "release/Study-Hub-checksums-${{ matrix.id }}.txt"
          echo "Uploading release/Study-Hub-checksums-${{ matrix.id }}.txt"
          gh release upload "$TAG" "release/Study-Hub-checksums-${{ matrix.id }}.txt" \
            --repo "imredavid64-glitch/study-hub-installers" --clobber
          # Upload the smoke report so the verify job can fold it into the
          # release notes. It only exists when the smoke test ran and passed.
          if [ -f "Study-Hub-report-${{ matrix.id }}.txt" ]; then
            echo "Uploading Study-Hub-report-${{ matrix.id }}.txt"
            gh release upload "$TAG" "Study-Hub-report-${{ matrix.id }}.txt" \
              --repo "imredavid64-glitch/study-hub-installers" --clobber
          fi

      - name: Publish skipped notice
        if: ${{ env.GH_TOKEN == '' }}
        run: echo "::warning::INSTALLERS_PAT secret is not set — installers were not published."

      - name: List built installers
        shell: bash
        run: |
          # Portable across macOS / Windows / Linux (GNU-only find -printf is
          # avoided); keeps the shellcheck lint clean.
          for f in release/Study-Hub-*; do
            [ -f "$f" ] && printf '%s  %s bytes\n' "$(basename "$f")" "$(wc -c < "$f")"
          done

  verify:
    name: Verify published installers
    needs: build
    # Runs whenever a publish happened (tag push or tag dispatch). Downloads the
    # published bytes and checks them against the sha256 checksums recorded from
    # the exact built files at publish time. If no PAT is configured nothing was
    # published, so the step reports that and exits cleanly.
    if: ${{ github.event_name == 'push' || github.event.inputs.tag != '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.INSTALLERS_PAT }}
      INSTALLERS_REPO: imredavid64-glitch/study-hub-installers
    steps:
      - name: Verify published installers
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "No INSTALLERS_PAT secret — nothing was published, skipping verification."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "Verifying release ${TAG}"
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "$INSTALLERS_REPO" --pattern 'Study-Hub-*'
          find . -maxdepth 1 -type f -name 'Study-Hub-*' | sort
          cat Study-Hub-checksums-*.txt > SHA256SUMS
          echo "=== expected checksums (recorded at build time) ==="
          cat SHA256SUMS
          echo "=== verifying downloaded bytes ==="
          sha256sum -c SHA256SUMS
          for f in Study-Hub-mac.dmg Study-Hub-mac.zip Study-Hub-Windows.zip Study-Hub-Linux.AppImage Study-Hub-Linux.deb; do
            [ -s "$f" ] || { echo "MISSING OR EMPTY: $f"; exit 1; }
          done
          echo "ALL INSTALLERS PRESENT AND CHECKSUMS VERIFIED"
          # Compose the release notes from the per-platform smoke reports and
          # the measured asset sizes. Only reached when verification passed, so
          # the notes always document verified bytes. The verify job is the
          # only writer of the notes, so there is no race between jobs.
          {
            echo "## Study Hub ${TAG} - desktop installers"
            echo
            echo "Built automatically by GitHub Actions. Every installer passed a platform smoke test before publishing, and its sha256 checksum was re-verified against the published bytes after upload."
            echo
            for entry in "mac:macOS" "win:Windows" "linux:Linux"; do
              id="${entry%%:*}"
              label="${entry##*:}"
              echo "### Smoke test - ${label}"
              echo
              echo '```'
              cat "Study-Hub-report-$id.txt"
              echo '```'
              echo
            done
            echo "## Published assets (sha256 verified)"
            echo
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in Study-Hub-mac.dmg Study-Hub-mac.zip Study-Hub-Windows.zip Study-Hub-Linux.AppImage Study-Hub-Linux.deb; do
              SIZE="$(ls -lh "$f" | awk '{print $5}')"
              echo "| \`$f\` | ${SIZE} |"
            done
            echo
            echo "_Checksums are recorded in the \`Study-Hub-checksums-*.txt\` assets of this release._"
          } > notes.md
          gh release edit "$TAG" --repo "$INSTALLERS_REPO" --notes-file notes.md
          echo "Release notes updated from smoke reports and verification results"

  summary:
    name: Summary
    needs: [build, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.INSTALLERS_PAT }}
    steps:
      - name: Note where to find the installers
        run: |
          echo "Installers were built for this tag: ${{ github.ref_name }}"
          if [ -n "$GH_TOKEN" ]; then
            echo "Published to https://github.com/imredavid64-glitch/study-hub-installers/releases/latest"
          else
            echo "Publish skipped (no INSTALLERS_PAT secret)."
          fi
